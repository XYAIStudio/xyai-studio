<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XYAI Studio</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1 class="title">XYAI Studio</h1>
        <div id="status" class="status" title="">连接中…</div>
      </header>

      <main id="transcript" class="transcript" aria-live="polite"></main>

      <footer class="composer">
        <textarea
          id="input"
          rows="2"
          placeholder="输入消息…"
          autocomplete="off"
        ></textarea>
        <button id="send" type="button">发送</button>
      </footer>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
