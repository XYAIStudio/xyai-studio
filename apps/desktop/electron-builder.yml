# XYAI Studio 0.5 — Windows NSIS installer
appId: studio.xyai.desktop
productName: XYAI Studio
copyright: Copyright © XYAI

icon: build/icon.ico

# bundle-for-pack.mjs writes pack-out/
directories:
  app: pack-out
  output: release
  buildResources: build

files:
  - '**/*'

asar: true

# OpenXYOS ships outside asar so 业务空间 can load it
extraResources:
  - from: ../../components/openxyos-pack
    to: openxyos
    filter:
      - '**/*'
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png

# Embed icon.ico into the exe after --dir (signAndEditExecutable is false).
afterPack: ./scripts/after-pack.cjs


win:
  icon: build/icon.ico
  # false avoids winCodeSign symlink privilege errors; pack scripts rcedit --set-icon after --dir
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '${productName}-${version}-Setup-${arch}.${ext}'

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: XYAI Studio
  uninstallDisplayName: XYAI Studio

linux:
  target:
    - dir
  category: Development
