name: macOS unsigned (internal)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  DSH_TELEMETRY_DISABLED: '1'
  PRIMARY_NODE_VERSION: '24'
jobs:
  macos-unsigned:
    name: Build unsigned macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Warn if llama-cpp looks Windows-only
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          llama_dir="resources/llama-cpp"
          if [[ ! -d "$llama_dir" ]]; then
            echo "::warning::resources/llama-cpp missing — local GGUF inference may be unavailable on macOS."
            exit 0
          fi
          dll_count=$(find "$llama_dir" -maxdepth 1 -iname '*.dll' | wc -l | tr -d ' ')
          exe_count=$(find "$llama_dir" -maxdepth 1 -iname '*.exe' | wc -l | tr -d ' ')
          dylib_count=$(find "$llama_dir" -maxdepth 1 \( -iname '*.dylib' -o -iname 'libllama*' \) | wc -l | tr -d ' ')
          if [[ "$dll_count" -gt 0 || "$exe_count" -gt 0 ]]; then
            if [[ "$dylib_count" -eq 0 ]]; then
              echo "::warning::llama-cpp under resources/ appears Windows-only (.dll/.exe present, no macOS dylib). Local GGUF on this Mac DMG will not work until darwin binaries are staged."
            else
              echo "llama-cpp has Windows binaries and some macOS-looking files; verify darwin runtime separately."
            fi
          else
            echo "llama-cpp does not look Windows-only (no .dll/.exe at top level)."
          fi

      - name: Workspace build
        run: pnpm --workspace-root run build

      - name: Desktop build
        working-directory: apps/desktop
        run: pnpm run build

      - name: Stage desktop runtime
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          if [[ -n "${PNPM_HOME:-}" && -f "$PNPM_HOME/../pnpm/bin/pnpm.mjs" ]]; then
            export npm_execpath="$PNPM_HOME/../pnpm/bin/pnpm.mjs"
          else
            PNPM_BIN="$(command -v pnpm)"
            export npm_execpath="$(dirname "$(dirname "$PNPM_BIN")")/pnpm/bin/pnpm.mjs"
          fi
          test -f "$npm_execpath"
          echo "npm_execpath=$npm_execpath"
          node --import tsx scripts/stage-runtime.ts

      - name: Package unsigned DMG
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm exec electron-builder --mac dmg \
            --config.forceCodeSigning=false \
            --config.mac.notarize=false \
            --config.mac.identity=null

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xyai-studio-macos-unsigned
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/mac
            apps/desktop/dist/mac-arm64
            apps/desktop/dist/mac-universal
          if-no-files-found: warn
          retention-days: 14

