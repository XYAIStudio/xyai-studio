name: macOS unsigned (internal)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  DSH_TELEMETRY_DISABLED: '1'
  PRIMARY_NODE_VERSION: '24'
jobs:
  macos-unsigned:
    name: Build unsigned macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Install xyos-backend production deps
        working-directory: apps/desktop
        run: node --import tsx scripts/install-xyos-backend-deps.ts

      - name: Stage llama-cpp darwin arm64
        working-directory: apps/desktop
        run: node --import tsx scripts/stage-llama-cpp-darwin.ts

      - name: Verify darwin llama-cpp staged
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          llama_dir="resources/llama-cpp"
          if [[ ! -f "$llama_dir/llama-server" ]]; then
            echo "::error::resources/llama-cpp/llama-server missing after staging"
            exit 1
          fi
          dylib_count=$(find "$llama_dir" -maxdepth 1 -iname "*.dylib" | wc -l | tr -d " ")
          if [[ "$dylib_count" -eq 0 ]]; then
            echo "::error::no .dylib under resources/llama-cpp after staging"
            exit 1
          fi
          echo "darwin llama-cpp ok: llama-server + ${dylib_count} dylib(s)"

      - name: Workspace build
        run: pnpm --workspace-root run build

      - name: Desktop build
        working-directory: apps/desktop
        run: pnpm run build

      - name: Stage desktop runtime
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          if [[ -n "${PNPM_HOME:-}" && -f "$PNPM_HOME/../pnpm/bin/pnpm.mjs" ]]; then
            export npm_execpath="$PNPM_HOME/../pnpm/bin/pnpm.mjs"
          else
            PNPM_BIN="$(command -v pnpm)"
            export npm_execpath="$(dirname "$(dirname "$PNPM_BIN")")/pnpm/bin/pnpm.mjs"
          fi
          test -f "$npm_execpath"
          echo "npm_execpath=$npm_execpath"
          node --import tsx scripts/stage-runtime.ts

      - name: Package unsigned DMG
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node --import tsx scripts/package-unsigned-dmg.ts

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xyai-studio-macos-unsigned
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/mac
            apps/desktop/dist/mac-arm64
            apps/desktop/dist/mac-universal
          if-no-files-found: warn
          retention-days: 14

